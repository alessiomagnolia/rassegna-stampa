<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Rassegna | Rassegna Stampa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20260804_03">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        /* ============ EDITOR LAYOUT ============ */
        body { overflow: hidden; }
        
        .editor-navbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px; z-index: 200;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem; gap: 1rem;
            background: rgba(10,10,26,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #efece5;
        }
        .editor-nav-left { display: flex; align-items: center; gap: 1rem; }
        .editor-title-input {
            background: transparent; border: none;
            color: #efece5; font-family: var(--font-sans);
            font-size: 1rem; font-weight: 600;
            padding: 4px 8px; border-radius: 6px;
            border: 1px solid transparent;
            transition: var(--transition); min-width: 280px;
        }
        .editor-title-input:focus {
            outline: none; border-color: var(--accent-primary);
            background: rgba(255,255,255,0.05);
        }
        .editor-article-count {
            font-size: 0.8rem; color: #b3b3b3;
            background: rgba(255,255,255,0.06); padding: 3px 10px;
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ============ EDITOR BODY ============ */
        .editor-body {
            display: flex; height: 100vh; padding-top: 60px;
        }

        /* --- Left Panel: Page List --- */
        .pages-panel {
            width: 220px; flex-shrink: 0;
            background: rgba(10,10,26,0.95); border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto; padding: 1rem 0.75rem;
            color: #efece5;
        }
        .pages-panel-label {
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--text-muted);
            margin-bottom: 0.75rem; padding: 0 0.25rem;
        }
        .page-thumb {
            display: flex; align-items: center; gap: 0.6rem;
            padding: 0.6rem 0.75rem; border-radius: 8px;
            cursor: pointer; margin-bottom: 4px;
            border: 1px solid transparent;
            transition: var(--transition); position: relative;
        }
        .page-thumb:hover { background: rgba(255,255,255,0.06); border-color: var(--border-color); }
        .page-thumb.active { background: rgba(124,92,255,0.15); border-color: var(--accent-primary); }
        .page-thumb-drag { cursor: grab; color: var(--text-muted); font-size: 1rem; flex-shrink: 0; }
        .page-thumb-drag:active { cursor: grabbing; }
        .page-thumb-info { flex: 1; min-width: 0; }
        .page-thumb-num {
            font-size: 0.65rem; color: var(--text-muted);
            font-weight: 700; margin-bottom: 2px;
        }
        .page-thumb-title {
            font-size: 0.78rem; color: var(--text-secondary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            font-weight: 500;
        }
        .page-thumb.active .page-thumb-title { color: var(--accent-primary); }
        .page-thumb-source {
            font-size: 0.65rem; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        /* SortableJS ghost/chosen */
        .page-thumb.sortable-ghost { opacity: 0.3; }
        .page-thumb.sortable-chosen { background: rgba(124,92,255,0.2) !important; }

        /* --- Center: Preview --- */
        .preview-area {
            flex: 1; overflow-y: auto;
            display: flex; flex-direction: column;
            align-items: center; padding: 2rem 1rem;
            background: #1a1a2a;
        }
        .preview-wrapper {
            position: relative; width: 100%; max-width: 760px;
        }
        .preview-edit-btn {
            position: absolute; top: 1rem; right: 1rem; z-index: 10;
            background: rgba(124,92,255,0.9); color: white;
            border: none; border-radius: 8px; padding: 8px 16px;
            font-family: inherit; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: var(--transition);
        }
        .preview-edit-btn:hover { background: var(--accent-primary); box-shadow: 0 0 15px rgba(124,92,255,0.5); }

        /* ============ PDF PAGE PREVIEW STYLES ============ */
        /* These mirror the PDF template CSS to show accurate preview */
        .pdf-page-preview {
            width: 100%; aspect-ratio: 210/297;
            background: white; color: #333;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            position: relative; overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            padding: 5.7% 5.7%;
        }
        .pdf-header {
            flex: 0 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 1.9%; min-height: 9.4%;
            background: #f8f9fa;
            border-bottom: 3px solid transparent;
            border-image: linear-gradient(to right, #7c5cff, #00d4aa) 1;
            margin-bottom: 3.8%;
        }
        .pdf-header-left { width: 55%; display: flex; align-items: center; }
        .pdf-header-right { width: 45%; text-align: right; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 3px; font-size: clamp(6px, 1.2vw, 11pt); color: #666; }
        .pdf-source-logo { max-height: 7%; max-width: 100%; object-fit: contain; }
        .pdf-source-name { font-size: clamp(8px, 1.8vw, 16pt); font-weight: 700; color: #1a1a2e; }
        .pdf-badge { display: inline-block; background: #eef2f5; color: #555; padding: 2px 6px; border-radius: 4px; font-size: clamp(5px, 0.9vw, 7pt); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .pdf-title-zone { flex: 0 0 auto; padding: 0 1.9%; margin-bottom: 3%; border-left: 4px solid #7c5cff; }
        .pdf-source-label { font-size: clamp(5px, 0.9vw, 8pt); color: #888; font-weight: 600; text-transform: uppercase; margin-bottom: 0.75%; letter-spacing: 0.5px; }
        .pdf-article-title { font-size: clamp(9px, 2.2vw, 20pt); font-weight: 700; color: #1a1a2e; line-height: 1.3; }
        .pdf-visual-zone { flex: 0 0 auto; margin: 0 1.9% 3.8%; max-height: 26%; overflow: hidden; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; justify-content: center; align-items: center; }
        .pdf-main-visual { width: 100%; max-height: 100%; object-fit: cover; display: block; }
        .pdf-content-zone { flex: 1 1 auto; padding: 0 1.9%; margin-bottom: 1.9%; overflow: hidden; }
        .pdf-content-text { font-size: clamp(7px, 1.2vw, 11pt); line-height: 1.6; color: #333; text-align: justify; font-family: 'Times New Roman', Times, serif; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 20; }
        .pdf-footer { flex: 0 0 3.8%; display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid #e0e0e0; padding-top: 1%; padding-left: 1.9%; padding-right: 1.9%; font-size: clamp(5px, 0.9vw, 9pt); color: #888; }
        .pdf-footer-link { color: #0066CC; max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Cover page preview */
        .pdf-cover-preview {
            width: 100%; aspect-ratio: 210/297;
            background: white; color: #333;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            position: relative; overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 7.5% 7.5%;
            text-align: center;
        }
        .pdf-cover-top { height: 22%; display: flex; align-items: flex-start; justify-content: center; }
        .pdf-cover-client-logo { max-width: 60%; max-height: 100%; object-fit: contain; }
        .pdf-cover-center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .pdf-cover-title { font-size: clamp(14px, 3.5vw, 38pt); font-weight: 700; color: #1a1a2e; margin-bottom: 3%; line-height: 1.2; }
        .pdf-cover-decor { width: 12%; height: 3px; background: linear-gradient(90deg, #7c5cff, #00d4aa); margin: 3% auto 4%; border-radius: 2px; }
        .pdf-cover-subtitle { font-size: clamp(8px, 1.8vw, 18pt); color: #555; font-family: 'Times New Roman', Times, serif; font-style: italic; margin-bottom: 2%; }
        .pdf-cover-date { font-size: clamp(6px, 1.3vw, 14pt); color: #888; letter-spacing: 2px; text-transform: uppercase; }
        .pdf-cover-bottom { height: 15%; display: flex; align-items: flex-end; justify-content: center; }
        .pdf-cover-agency-logo { max-width: 25%; max-height: 100%; object-fit: contain; }

        /* ============ RIGHT EDIT PANEL ============ */
        .edit-panel {
            position: fixed; top: 60px; right: 0; bottom: 0;
            width: 400px; z-index: 150;
            background: rgba(12,12,28,0.98);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.1);
            transform: translateX(100%);
            color: #efece5;
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .edit-panel.open { transform: translateX(0); }
        .edit-panel-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .edit-panel-header h3 { font-size: 1rem; margin: 0; }
        .edit-panel-body { flex: 1; overflow-y: auto; padding: 1.5rem; }
        .edit-panel-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); flex-shrink: 0; }

        .edit-field { margin-bottom: 1.25rem; }
        .edit-field label { display: block; font-size: 0.8rem; font-weight: 600; color: #b3b3b3; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 0.5rem; }
        .edit-field input[type="text"],
        .edit-field input[type="url"],
        .edit-field input[type="date"],
        .edit-field select,
        .edit-field textarea {
            width: 100%; padding: 0.65rem 0.9rem;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: #efece5;
            font-family: inherit; font-size: 0.9rem; transition: var(--transition);
        }
        .edit-field textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
        .edit-field input:focus, .edit-field textarea:focus, .edit-field select:focus {
            outline: none; border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(124,92,255,0.2);
        }
        .edit-image-preview {
            width: 100%; height: 80px; object-fit: cover; border-radius: 6px;
            border: 1px solid var(--border-color); margin-bottom: 0.5rem;
        }
        .edit-logo-preview {
            max-height: 40px; max-width: 100%; object-fit: contain;
            background: white; padding: 4px 8px; border-radius: 4px;
            margin-bottom: 0.5rem; display: block;
        }
        .edit-remove-btn { font-size: 0.75rem; color: var(--danger); background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; }
        .edit-remove-btn:hover { text-decoration: underline; }

        /* Toggle switch */
        .toggle-switch { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; cursor: pointer; inset: 0;
            background: rgba(255,255,255,0.1); border: 1px solid var(--border-color);
            border-radius: 24px; transition: 0.3s;
        }
        .toggle-slider::before {
            content: ''; position: absolute;
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background: #666; border-radius: 50%; transition: 0.3s;
        }
        .toggle-switch input:checked + .toggle-slider { background: var(--accent-primary); border-color: var(--accent-primary); }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); background: white; }
    </style>
</head>
<body>
<div class="bg-animation"></div>

<!-- TOP NAVBAR -->
<nav class="editor-navbar">
    <div class="editor-nav-left">
        <button class="btn btn-outline btn-sm" id="btnBackToDashboard" onclick="goBackToDashboard()" title="Torna alla Rassegna">
            <i data-feather="arrow-left" style="width:16px;height:16px;"></i> <span class="hide-mobile">Dashboard</span>
        </button>
        <input type="text" id="editorTitle" class="editor-title-input hide-mobile" placeholder="Titolo rassegna...">
        <span id="editorArticleCount" class="editor-article-count hide-mobile">0 articoli</span>
    </div>
    <div style="display:flex; gap:0.5rem; align-items:center;">
        <button type="button" class="btn btn-outline btn-sm" onclick="saveRassegnaToArchive()" title="Salva in Archivio" style="padding:4px 8px; font-size:0.75rem; border-color:rgba(255,255,255,0.25); color:white;">
            <i data-feather="archive" style="width:14px;height:14px;"></i> <span class="hide-mobile">Archivia</span>
        </button>
        <select id="editorTemplateSelect" class="hide-mobile" title="Seleziona Template PDF" style="background: rgba(255,255,255,0.1); color: #efece5; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); font-size: 0.85rem; padding: 5px 8px; cursor: pointer; outline: none;">
            <option value="classic" style="color: black;">🏛️ Template Classico</option>
            <option value="modern" style="color: black;">⚡ Modern Executive</option>
            <option value="minimal" style="color: black;">📰 Minimal Editorial</option>
        </select>
        <button id="btnGeneratePDF" class="btn btn-gradient btn-sm" style="padding:4px 10px; font-size:0.78rem; font-weight:700;">
            <i data-feather="download" style="width:14px;height:14px;"></i> <span class="hide-mobile">Genera PDF</span>
        </button>
        <div id="genLoading" class="hidden" style="display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:0.9rem;">
            <div class="spinner" style="width:18px;height:18px;"></div>
        </div>
    </div>
</nav>

<!-- SUB-HEADER TITLE BAR (Mobile Only, Centered at Top Under Navbar) -->
<div class="editor-sub-header show-mobile-flex" style="gap:8px; justify-content:space-between;">
    <input type="text" id="editorTitleMobile" class="editor-title-input-mobile" placeholder="Titolo della Rassegna..." oninput="syncMobileTitle(this.value)" style="flex:1; min-width:0;">
    <span id="editorArticleCountMobile" style="font-size:0.75rem; color:rgba(255,255,255,0.7); font-weight:600; white-space:nowrap; padding: 4px 8px; background: rgba(255,255,255,0.08); border-radius: 12px;">0 pag.</span>
</div>
<!-- MOBILE PAGE INDICATOR (shown above the preview) -->
<div id="mobilePdfPageIndicator" style="display:none; position:fixed; top:96px; left:50%; transform:translateX(-50%); z-index:195; background:rgba(11,17,32,0.92); color:white; font-size:0.72rem; font-weight:700; padding:3px 14px; border-radius:20px; border:1px solid rgba(255,255,255,0.15); pointer-events:none;"></div>

<!-- FLOATING UNDO (CTRL+Z) BUTTON FOR MOBILE -->
<button type="button" id="btnUndoState" class="btn-undo-floating show-mobile-flex" onclick="undoLastEdit()" title="Annulla Modifica (Ctrl+Z)">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
</button>

<!-- EDITOR BODY -->
<div class="editor-body">

    <!-- LEFT: Pages List -->
    <aside class="pages-panel">
        <div class="pages-panel-label">Pagine</div>
        <div id="pagesList"><!-- injected --></div>
    </aside>

    <!-- CENTER: Preview Area -->
    <div class="preview-area" id="previewArea">
        <div class="preview-wrapper" id="previewWrapper" onclick="if(window.innerWidth <= 900) openPdfSheet('sheet-pdf-articles');">
            <button class="preview-edit-btn hide-mobile" id="btnEditPage"><i data-feather="edit-2" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i> Modifica questa pagina</button>
            <div id="pagePreviewContent"><!-- injected --></div>
        </div>
    </div>

</div>

<!-- RIGHT: Edit Panel (Desktop Side Panel) -->
<div class="edit-panel" id="editPanel">
    <div class="edit-panel-header">
        <h3><i data-feather="edit-3" style="width:18px;height:18px;vertical-align:middle;margin-right:4px;"></i> Modifica articolo</h3>
        <button class="btn-icon" id="btnCloseEditPanel"><i data-feather="x"></i></button>
    </div>
    <div class="edit-panel-body">
        <div class="edit-field">
            <label>Titolo *</label>
            <input type="text" id="editTitle" placeholder="Titolo dell'articolo">
        </div>
        <div class="edit-field">
            <label>Testo / Estratto *</label>
            <textarea id="editExcerpt" placeholder="Testo dell'articolo..."></textarea>
        </div>
        <div class="edit-field" style="display:flex;gap:10px;">
            <div style="flex:1;">
                <label>Fonte</label>
                <input type="text" id="editSourceName" placeholder="es. Corriere della Sera">
            </div>
            <div style="flex:1;">
                <label>Tipologia</label>
                <select id="editSourceType">
                    <option value="Web">Web</option>
                    <option value="Quotidiano Nazionale">Quotidiano Naz.</option>
                    <option value="Quotidiano Locale">Quotidiano Loc.</option>
                    <option value="Agenzia di Stampa">Agenzia</option>
                    <option value="Periodico">Periodico</option>
                    <option value="Radio/TV">Radio/TV</option>
                </select>
            </div>
        </div>
        <div class="edit-field">
            <label>Data Pubblicazione</label>
            <input type="text" id="editDate" placeholder="es. 21/07/2026">
        </div>
        <div class="edit-field">
            <label>Link articolo</label>
            <input type="url" id="editUrl" placeholder="https://...">
        </div>

        <!-- Image -->
        <div class="edit-field">
            <label>Immagine principale</label>
            <div id="editImagePreviewContainer" class="hidden">
                <img id="editImagePreview" class="edit-image-preview" src="" alt="">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px; padding: 0 2px;">
                    <select id="editImagePosition" style="width: auto; padding: 2px 6px; font-size: 0.75rem; background: rgba(255,255,255,0.1); color: #efece5; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2);">
                        <option value="top center" style="color: black;">Posizione: Alto</option>
                        <option value="center center" style="color: black;">Posizione: Centro</option>
                        <option value="bottom center" style="color: black;">Posizione: Basso</option>
                    </select>
                    <button class="edit-remove-btn" onclick="removeEditImage()"><i data-feather="trash-2" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i> Rimuovi immagine</button>
                </div>
            </div>
            <input type="file" id="editImageInput" accept="image/*" class="hidden">
            <label for="editImageInput" class="btn btn-outline btn-sm" style="cursor:pointer;margin-top:6px;display:inline-block;"><i data-feather="image" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i> Cambia immagine</label>
        </div>

        <!-- Logo -->
        <div class="edit-field">
            <label>Logo testata</label>
            <div id="editLogoPreviewContainer" class="hidden">
                <img id="editLogoPreview" class="edit-logo-preview" src="" alt="">
                <button class="edit-remove-btn" onclick="removeEditLogo()"><i data-feather="trash-2" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i> Rimuovi logo</button>
            </div>
            <input type="file" id="editLogoInput" accept="image/*" class="hidden">
            <label for="editLogoInput" class="btn btn-outline btn-sm" style="cursor:pointer;margin-top:6px;display:inline-block;"><i data-feather="image" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i> Cambia logo</label>
        </div>

        <!-- Dark Header Toggle -->
        <div class="edit-field">
            <label>Fascia header nel PDF</label>
            <div style="display:flex; align-items:center; gap:0.75rem; padding: 0.75rem; background:rgba(0,0,0,0.2); border-radius:8px; border:1px solid var(--border-color);">
                <label class="toggle-switch" title="Attiva header scuro quando il logo è bianco">
                    <input type="checkbox" id="editDarkHeader">
                    <span class="toggle-slider"></span>
                </label>
                <div>
                    <div style="font-size:0.85rem; font-weight:600; color:var(--text-primary);">Header scuro</div>
                    <div style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;">Usa sfondo scuro (#1a1a2e) per loghi bianchi</div>
                </div>
                <div id="darkHeaderPreviewSwatch" style="margin-left:auto; width:32px; height:32px; border-radius:6px; border:1px solid var(--border-color); flex-shrink:0; transition:background 0.3s;"></div>
            </div>
        </div>
    </div>
    <div class="edit-panel-footer">
        <button class="btn btn-primary" style="width:100%;" id="btnSaveEdit"><i data-feather="save" style="width:18px;height:18px;vertical-align:middle;margin-right:4px;"></i> Salva modifiche</button>
    </div>
</div>

<!-- CANVA MOBILE BOTTOM NAVIGATION DOCK FOR PDF EDITOR (Horizontally Scrollable) -->
<nav class="canva-bottom-dock show-mobile-flex">
    <button type="button" class="canva-dock-btn active" onclick="openPdfSheet('sheet-pdf-articles', this)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Pagine</span>

<script>
// ============================================================
// STATE
// ============================================================
let articles = [];
let options = { title: '', clientName: '', clientLogo: '' };
let selectedIdx = 0; // currently previewed article index (0 = cover if title exists)
let hasCover = false;
const token = localStorage.getItem('rs_token');

if (!token) { window.location.href = 'index.html'; }

// ============================================================
// LOAD STATE
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    const raw = localStorage.getItem('rs_editor_state');
    if (!raw) { alert('Nessun dato trovato. Torna alla dashboard.'); window.location.href = 'dashboard.html'; return; }
    
    try {
        const state = JSON.parse(raw);
        articles = state.articles || [];
        options = state.options || {};
    } catch {
        alert('Errore caricamento dati. Torna alla dashboard.');
        window.location.href = 'dashboard.html';
        return;
    }

    options.title = options.title || 'Rassegna Stampa';
    hasCover = true;
    if (document.getElementById('editorTitle')) document.getElementById('editorTitle').value = options.title;
    if (document.getElementById('editorTitleMobile')) document.getElementById('editorTitleMobile').value = options.title;
    if (document.getElementById('editorArticleCount')) document.getElementById('editorArticleCount').textContent = `${articles.length} articol${articles.length === 1 ? 'o' : 'i'}`;
    
    // Set active template
    const templateSelect = document.getElementById('editorTemplateSelect');
    if (templateSelect) {
        templateSelect.value = options.templateId || 'classic';
        templateSelect.addEventListener('change', (e) => {
            options.templateId = e.target.value;
            pushUndoState();
        });
    }

    updatePageCounters();
    renderPagesList();
    if (window.innerWidth > 900 && articles.length > 0) {
        selectPage(0);
    } else {
        selectPage(-1);
    }
    initSortable();
    initEvents();
    if (window.innerWidth <= 900) {
        initPdfPreviewSwipe();
    }
    pushUndoState();
});

function updatePageCounters() {
    const totalPages = articles.length + (hasCover ? 1 : 0);

    const countEl = document.getElementById('editorArticleCount');
    if (countEl) {
        countEl.textContent = `${articles.length} articol${articles.length === 1 ? 'o' : 'i'}`;
    }

    const mobCountEl = document.getElementById('editorArticleCountMobile');
    if (mobCountEl) {
        mobCountEl.textContent = `${totalPages} pag.`;
    }
}

// ============================================================
// RENDER LEFT PANEL & MOBILE PAGES LIST
// ============================================================
function renderPagesList() {
    updatePageCounters();
    const container = document.getElementById('pagesList');
    const mobContainer = document.getElementById('mobilePagesList');
    if (container) container.innerHTML = '';
    if (mobContainer) mobContainer.innerHTML = '';

    // Cover page thumb (if title set)
    if (hasCover) {
        const el = document.createElement('div');
        el.className = 'page-thumb' + (selectedIdx === -1 ? ' active' : '');
        el.dataset.coverPage = '1';
        el.innerHTML = `
            <div class="page-thumb-info">
                <div class="page-thumb-num">COPERTINA</div>
                <div class="page-thumb-title">${escHtml(options.title)}</div>
            </div>`;
        const mEl = el.cloneNode(true);
        el.addEventListener('click', () => selectPage(-1));
        mEl.addEventListener('click', () => { selectPage(-1); closePdfSheets(); });
        if (container) container.appendChild(el);
        if (mobContainer) mobContainer.appendChild(mEl);
    }

    // Article page thumbs
    articles.forEach((art, idx) => {
        const el = document.createElement('div');
        el.className = 'page-thumb' + (selectedIdx === idx ? ' active' : '');
        el.dataset.idx = idx;
        el.innerHTML = `
            <span class="page-thumb-drag" title="Trascina per riordinare">⠿</span>
            <div class="page-thumb-info">
                <div class="page-thumb-num">PAG ${hasCover ? idx + 2 : idx + 1}</div>
                <div class="page-thumb-title">${escHtml(art.title)}</div>
                <div class="page-thumb-source">${escHtml(art.source_name || '')}</div>
            </div>`;
        
        const mEl = el.cloneNode(true);
        let isTouchMoved = false;
        el.addEventListener('click', () => selectPage(idx));
        mEl.addEventListener('touchstart', () => { isTouchMoved = false; }, { passive: true });
        mEl.addEventListener('touchmove', () => { isTouchMoved = true; }, { passive: true });
        mEl.addEventListener('click', () => {
            if (isTouchMoved) return;
            selectPage(idx);
            closePdfSheets();
        });

        if (container) container.appendChild(el);
        if (mobContainer) mobContainer.appendChild(mEl);
    });
}

// ============================================================
// SELECT & PREVIEW PAGE
// ============================================================
function selectPage(idx) {
    selectedIdx = idx;
    
    // Update active thumb
    document.querySelectorAll('.page-thumb').forEach(el => el.classList.remove('active'));
    if (idx === -1) {
        document.querySelectorAll('[data-cover-page]').forEach(el => el.classList.add('active'));
    } else {
        document.querySelectorAll(`[data-idx="${idx}"]`).forEach(el => el.classList.add('active'));
    }

    // Render preview
    const previewEl = document.getElementById('pagePreviewContent');
    const editBtn = document.getElementById('btnEditPage');
    
    const total = articles.length;
    const pageNum = idx === -1 ? 1 : (hasCover ? idx + 2 : idx + 1);
    const totalPages = hasCover ? total + 1 : total;

    const mobIndicator = document.getElementById('mobilePdfPageIndicator');
    if (mobIndicator) {
        mobIndicator.textContent = idx === -1 ? `Copertina (${pageNum} di ${totalPages})` : `Pagina ${pageNum} di ${totalPages}`;
    }

    if (idx === -1) {
        // Cover
        previewEl.innerHTML = renderCoverPreview();
        editBtn.style.display = 'none';
    } else {
        previewEl.innerHTML = renderArticlePreview(articles[idx], pageNum, totalPages);
        editBtn.style.display = 'block';
    }

    // Desktop: Populate Desktop Right Panel when an article is selected!
    if (idx >= 0 && typeof populateEditForm === 'function') {
        populateEditForm(idx);
    } else if (idx < 0 && typeof closeEditPanel === 'function') {
        closeEditPanel();
    }

    // Mobile Only: Touch Resizing & Mobile Form
    if (window.innerWidth <= 900) {
        attachPdfTouchResizing();
        if (idx >= 0) {
            populateMobileEditForm(idx);
        }
        // Show page indicator
        const mobInd = document.getElementById('mobilePdfPageIndicator');
        if (mobInd) mobInd.style.display = 'block';
    }
}

// Desktop alias: populate right-side edit panel
function populateEditForm(idx) {
    if (window.innerWidth > 900) openEditPanel(idx);
}

// Mobile: pre-fill all bottom sheet fields for the selected article
function populateMobileEditForm(idx) {
    if (idx < 0 || !articles[idx]) return;
    const art = articles[idx];
    const v = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
    v('mTextTitle', art.title);
    v('mTextExcerpt', art.excerpt);
    v('mTextDate', art.published_date);
    v('mSourceName', art.source_name);
    if (document.getElementById('mSourceType')) document.getElementById('mSourceType').value = art.source_type || 'Web';
    v('mobileOptionsUrl', art.url);
    if (document.getElementById('mobileOptionsDarkHeader')) document.getElementById('mobileOptionsDarkHeader').checked = !!art.darkHeader;
}

// ============================================================
// PREVIEW RENDERERS & BOLDING LOGIC
// ============================================================
function buildKeywordRegex(title, clientName) {
    const stopWords = new Set([
        'il','lo','la','i','gli','le','un','uno','una','di','da','in','con',
        'su','per','tra','fra','che','non','più','del','dell','della','dello',
        'dei','degli','delle','al','alla','allo','ai','agli','alle','nel',
        'nella','nello','nei','negli','nelle','sul','sulla','sullo','sui',
        'sugli','sulle','come','sono','era','hanno','anche','dopo','prima',
    ]);
    const allWords = [title, clientName].filter(Boolean).join(' ')
        .split(/[\s\-–—_\/]+/)
        .map(w => w.replace(/[^a-zA-ZàèéìòùÀÈÉÌÒÙ]/g, '').toLowerCase())
        .filter(w => w.length >= 4 && !stopWords.has(w));
    const unique = [...new Set(allWords)];
    if (unique.length === 0) return null;
    unique.sort((a, b) => b.length - a.length);
    const pattern = unique.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
    return new RegExp(`(?<![a-zA-ZàèéìòùÀÈÉÌÒÙ])(${pattern})(?![a-zA-ZàèéìòùÀÈÉÌÒÙ])`, 'gi');
}
function boldKeywords(text, regex) {
    if (!regex || !text) return text;
    return text.replace(regex, '<strong style="color:#1a1a2e;font-weight:700;">$1</strong>');
}

function renderCoverPreview() {
    const today = new Date();
    const dateStr = `${String(today.getDate()).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}/${today.getFullYear()}`;
    return `
    <div class="pdf-cover-preview">
        <div class="pdf-cover-top">
            ${options.clientLogo ? `<img src="${options.clientLogo}" class="pdf-cover-client-logo" alt="Logo Cliente">` : ''}
        </div>
        <div class="pdf-cover-center">
            <div class="pdf-cover-title">${escHtml(options.title || 'Rassegna Stampa')}</div>
            <div class="pdf-cover-decor"></div>
            ${options.clientName ? `<div class="pdf-cover-subtitle">${escHtml(options.clientName)}</div>` : ''}
            <div class="pdf-cover-date">${dateStr}</div>
        </div>
        <div class="pdf-cover-bottom">
        </div>
    </div>`;
}

// ============================================================
// SORTABLEJS — Drag & Drop Pages (Desktop & Mobile)
// ============================================================
function initSortable() {
    const list = document.getElementById('pagesList');
    const mobList = document.getElementById('mobilePagesList');

    const handleSortEnd = (evt) => {
        const coverOffset = hasCover ? 1 : 0;
        const oldIdx = evt.oldIndex - coverOffset;
        const newIdx = evt.newIndex - coverOffset;
        if (oldIdx < 0 || newIdx < 0 || oldIdx === newIdx) return;

        const [moved] = articles.splice(oldIdx, 1);
        articles.splice(newIdx, 0, moved);

        if (selectedIdx === oldIdx) selectedIdx = newIdx;
        else if (selectedIdx > oldIdx && selectedIdx <= newIdx) selectedIdx--;
        else if (selectedIdx < oldIdx && selectedIdx >= newIdx) selectedIdx++;

        pushUndoState();
        renderPagesList();
        selectPage(selectedIdx);
    };

    if (list) {
        Sortable.create(list, {
            handle: '.page-thumb-drag',
            animation: 200,
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            filter: '[data-cover-page]', // cover can't be dragged
            onEnd: handleSortEnd
        });
    }

    if (mobList) {
        Sortable.create(mobList, {
            animation: 200,
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            filter: '[data-cover-page]',
            delay: 150, // Press & hold 150ms anywhere on card selects it & enables drag!
            delayOnTouchOnly: true,
            touchStartThreshold: 3,
            onEnd: handleSortEnd
        });
    }
}

// ============================================================
// GENERATE PDF
// ============================================================
async function generateAndDownload() {
    const btn = document.getElementById('btnGeneratePDF');
    const loading = document.getElementById('genLoading');
    btn.classList.add('hidden');
    loading.classList.remove('hidden');

    try {
        const title = document.getElementById('editorTitle').value.trim();
        const res = await fetch('/api/pdf/generate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                articles,
                title: title || options.title || '',
                clientName: options.clientName || '',
                clientLogo: options.clientLogo || '',
                templateId: options.templateId || 'classic'
            })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        // Trigger download via fetch to include Auth token
        const downloadRes = await fetch(data.downloadUrl, {
            headers: { 'Authorization': `Bearer ${localStorage.getItem('rs_token')}` }
        });
        if (!downloadRes.ok) throw new Error('Errore durante il download del PDF');
        
        const blob = await downloadRes.blob();
        const objectUrl = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = objectUrl;
        link.download = data.filename || 'Rassegna_Stampa.pdf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(objectUrl);

        showToast('PDF generato e scaricato!', 'success');

        // Sync localStorage with latest articles (including any edits made in editor)
        // so when the user goes back to dashboard, articles are up to date
        const finalTitle = title || options.title || '';
        options.title = finalTitle;
        hasCover = !!(finalTitle);
        localStorage.setItem('rs_editor_state', JSON.stringify({ articles, options }));
        renderPagesList();

    } catch (err) {
        showToast(err.message || 'Errore generazione PDF', 'error');
    } finally {
        btn.classList.remove('hidden');
        loading.classList.add('hidden');
    }
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

function showToast(message, type = 'info') {

}

// ============================================================
// TOUCH SWIPE GESTURES FOR PAGE NAVIGATION
// ============================================================
function initPdfPreviewSwipe() {
    const container = document.getElementById('previewArea');
    if (!container) return;

    let startX = 0;
    let startY = 0;

    container.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    }, { passive: true });

    container.addEventListener('touchend', (e) => {
        if (!e.changedTouches || !e.changedTouches.length) return;
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;

        const deltaX = endX - startX;
        const deltaY = endY - startY;

        // Horizontal swipe threshold: deltaX > 40px and more horizontal than vertical
        if (Math.abs(deltaX) > 40 && Math.abs(deltaX) > Math.abs(deltaY) * 1.1) {
            if (deltaX < 0) {
                // Swiped Left -> Next page
                navigatePdfPage(1);
            } else {
                // Swiped Right -> Previous page
                navigatePdfPage(-1);
            }
        }
    }, { passive: true });
}

function undoLastEdit() {
    if (undoStack.length <= 1) {
        showToast('Nessuna modifica da annullare', 'info');
        return;
    }
    undoStack.pop(); // Remove current
    const previous = JSON.parse(undoStack[undoStack.length - 1]);
    articles = previous.articles || [];
    options = previous.options || {};
    hasCover = !!(options.title && options.title.trim());

    if (document.getElementById('editorTitle')) document.getElementById('editorTitle').value = options.title || '';
    if (document.getElementById('editorTitleMobile')) document.getElementById('editorTitleMobile').value = options.title || '';

    renderPagesList();

let selectedPdfElement = null;

    preview.querySelectorAll('.pdf-article-title, .pdf-content-text, .pdf-main-visual, .pdf-source-logo').forEach(el => {

function deselectPdfElement() {

        selectedPdfElement.classList.remove('card-element-selected');

    }
    const sizeBar = document.getElementById('cardElementSizeBar');
    if (sizeBar) {
        sizeBar.classList.add('hidden');
        sizeBar.style.display = 'none';
    }
}

function changePdfElementSize(delta) {
    if (!selectedPdfElement) return;

    if (selectedPdfElement.tagName.toLowerCase() === 'img') {
        const curH = parseInt(window.getComputedStyle(selectedPdfElement).maxHeight) || 200;
        const newH = Math.max(24, Math.min(600, curH + delta * 12));
        selectedPdfElement.style.maxHeight = `${newH}px`;
    } else {
        const curSize = parseFloat(window.getComputedStyle(selectedPdfElement).fontSize) || 16;
        const newSize = Math.max(10, Math.min(64, curSize + delta * 2));
        selectedPdfElement.style.fontSize = `${newSize}px`;
    }
    pushUndoState();
}

function closePdfSheets() {

    document.querySelectorAll('.canva-bottom-sheet').forEach(s => {

    });

function initPdfSheetSwipeToDismiss() {
    document.querySelectorAll('.canva-bottom-sheet').forEach(sheet => {
        // EXCLUDE 'sheet-pdf-articles' (Pagine e Articoli) from swipe-to-dismiss
        // so page reordering drag gestures are never interrupted!
        if (sheet.id === 'sheet-pdf-articles') return;

        let startY = 0;
        let currentY = 0;
        let isDragging = false;

        sheet.addEventListener('touchstart', (e) => {
            const targetTag = e.target.tagName.toLowerCase();
            if (['input', 'textarea', 'select', 'button'].includes(targetTag)) return;
            if (sheet.scrollTop > 5) return;

            startY = e.touches[0].clientY;
            currentY = startY;
            isDragging = true;
            sheet.style.transition = 'none';
        }, { passive: true });

        sheet.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            const deltaY = currentY - startY;
            if (deltaY > 0) {
                sheet.style.transform = `translateY(${deltaY}px)`;
            }
        }, { passive: true });

        sheet.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            sheet.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
            const deltaY = currentY - startY;
            if (deltaY > 50) {
                closePdfSheets();
            } else {
                sheet.style.transform = '';
            }
        });
    });
}
